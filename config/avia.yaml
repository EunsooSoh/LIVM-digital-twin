/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
            scan_line: 6
            blind: 4.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    90.0
            det_range:     450.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ 0.04165, 0.02326, -0.0284 ]
            extrinsic_R: [ 1., 0., 0.,
                        0., 1., 0.,
                        0., 0., 1.]

        publish:
            path_en:  false
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

        # Stage A: Camera Calibration Parameters
        camera:
            # Camera intrinsics (fixed from Stage A calibration)
            intrinsics:
                fx: 700.0               # Focal length in x (pixels)
                fy: 700.0               # Focal length in y (pixels)
                cx: 640.0               # Principal point x (pixels)
                cy: 360.0               # Principal point y (pixels)
                k1: 0.0                 # Radial distortion coefficient
                k2: 0.0                 # Radial distortion coefficient
                k3: 0.0                 # Radial distortion coefficient
                p1: 0.0                 # Tangential distortion coefficient
                p2: 0.0                 # Tangential distortion coefficient
            
            # Camera extrinsics (Camera to LiDAR/IMU transformation)
            extrinsics:
                camera_to_lidar_T: [ 0.0, 0.0, 0.0 ]  # Translation [x, y, z] in meters
                camera_to_lidar_R: [ 1., 0., 0.,      # Rotation matrix (row-major)
                                    0., 1., 0.,
                                    0., 0., 1.]
        
        # Stage A: Temporary Tag/Marker Parameters (will be replaced with Tag-Plane later)
        tags:
            # Fiducial marker configuration for calibration
            tag_size: 0.1               # Tag size in meters (temporary value)
            tag_family: "tag36h11"      # AprilTag family
            
            # Tag positions in world frame {W} (temporary values, to be replaced)
            tag_positions:
                - id: 0
                  position: [0.0, 0.0, 0.0]     # [x, y, z] in world frame
                  orientation: [1., 0., 0., 0., 1., 0., 0., 0., 1.]  # Rotation matrix
                
                - id: 1
                  position: [1.0, 0.0, 0.0]
                  orientation: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
                
                - id: 2
                  position: [0.0, 1.0, 0.0]
                  orientation: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
